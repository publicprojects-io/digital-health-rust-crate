# cargo tarpaulin reads this file. Run: bin/coverage
[default]
all-features = true
# Unit tests, integration tests, and doctests (the worked examples).
run-types = ["Tests", "Doctests"]
out = ["Stdout", "Html", "Xml"]
output-dir = "target/coverage"
# Benchmarks and test code don't count towards coverage.
exclude-files = ["benches/*", "tests/*"]
# Floor: every metric module is small and fully tested, so require high coverage.
fail-under = 95
