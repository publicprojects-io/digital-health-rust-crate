[package]
name = "digital-health"
version = "0.5.0"
edition = "2024"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Digital health metrics models, structs, calculations, and examples."
readme = "README.md"
repository = "https://github.com/publicprojects-io/digital-health-rust-crate/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only"
keywords = ["digital", "health", "statistics", "analytics", "medical"]
categories = ["science", "data-structures"]
include = [
    "src/**/*",
    "spec/**/*",
    "docs/tutorials/**/*",
    "digital-health-skill/**/*",
    "LICENSE.md",
    "README.md",
    "AGENTS.md",
    "CLAUDE.md",
    "llms.txt",
    "llms.json",
]

[dependencies]
rusty-money = "0.5"

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
