[package]
name = "digital-health"
version = "1.2.3"
edition = "2024"
rust-version = "1.98"
authors = ["Joel Parker Henderson <joel@joelparkerhenderson.com>"]
description = "Digital health metrics models, structs, calculations, and examples."
readme = "README.md"
repository = "https://github.com/publicprojects-io/digital-health-rust-crate/"
license = "MIT OR Apache-2.0 OR BSD-3-Clause OR GPL-2.0-only OR GPL-3.0-only OR OGL-UK-3.0 OR CC-BY-NC-SA-4.0"
keywords = ["digital", "health", "statistics", "analytics", "medical"]
categories = ["science", "data-structures"]
include = [
    "src/**/*",
    "spec/**/*",
    "docs/tutorials/**/*",
    "digital-health-skill/**/*",
    "LICENSE.md",
    "README.md",
    "AGENTS.md",
    "CLAUDE.md",
    "llms.txt",
    "llms.json",
]

[dependencies]
rusty-money = "0.5"

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"

[[bench]]
name = "metrics"
harness = false

[lints.rust]
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false

# cargo-mutants builds every mutant once in a throwaway copy of the tree: no debug information and no
# incremental state make each build quicker and smaller. `.cargo/mutants.toml` selects it.
[profile.mutants]
inherits = "test"
debug = "none"
incremental = false
